name: Bug report
description: Report unexpected Gleiswerk behaviour
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include security-sensitive information. See SECURITY.md
        for private reporting.
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gleiswerk version
      placeholder: 0.0.2
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
