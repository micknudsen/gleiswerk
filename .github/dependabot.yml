version: 2
updates:
  - package-ecosystem: conda
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      conda-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
