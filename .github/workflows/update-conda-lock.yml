name: Update Conda lockfile

on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh locked dependencies
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_UPDATE_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up locked Conda environment
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3
        with:
          environment-file: gleiswerk.conda-lock.yml
          environment-name: gleiswerk-lock-update
          init-shell: bash
          post-cleanup: environment

      - name: Refresh lockfile for all supported platforms
        run: |
          conda-lock lock --micromamba --file environment.yml \
            --lockfile gleiswerk.conda-lock.yml \
            --platform osx-arm64 --platform osx-64 --platform linux-64 --platform win-64

      - name: Verify dependency update token is configured
        if: env.DEPENDENCY_UPDATE_TOKEN == ''
        run: |
          echo "DEPENDENCY_UPDATE_TOKEN is required to create a pull request that triggers CI."
          exit 1

      - name: Create or update dependency pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.DEPENDENCY_UPDATE_TOKEN }}
          add-paths: gleiswerk.conda-lock.yml
          branch: chore/conda-lock-update
          commit-message: "chore(deps): update Conda lockfile"
          title: "chore(deps): update Conda lockfile"
          body: |
            Refreshes the resolved Conda dependencies for all supported platforms.

            This pull request is created by the scheduled Conda lockfile update workflow.
          labels: dependencies
