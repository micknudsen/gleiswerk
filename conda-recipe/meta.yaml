{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set project = pyproject['project'] %}

package:
  name: gleiswerk
  version: "{{ project['version'] }}"

source:
  path: ..

build:
  number: 0
  noarch: python
  entry_points:
    - gleiswerk = gleiswerk.cli:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir"

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11

test:
  imports:
    - gleiswerk
  commands:
    - gleiswerk --help
    - gleiswerk --version

about:
  home: https://github.com/micknudsen/gleiswerk
  license: MIT
  license_file: LICENSE
  summary: Local-first model railway control and automation
