# Deliberately invalid schema-version 2 topology configuration.
#
# This example demonstrates route-continuity diagnostics. The first traversal
# ends at platform-1.west, while the second starts at platform-1.east. A block
# does not implicitly connect its endpoints, so the route is discontinuous.
schema-version = 2

[blocks.west-entry]
endpoints = ["west", "east"]

[blocks.platform-1]
endpoints = ["west", "east"]

[blocks.depot]
endpoints = ["west", "east"]

[traversals.west-to-platform]
from = "west-entry.east"
to = "platform-1.west"

[traversals.platform-to-depot]
from = "platform-1.east"
to = "depot.west"

[routes.invalid-arrival]
traversals = ["west-to-platform", "platform-to-depot"]
