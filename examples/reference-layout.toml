# Gleiswerk schema-version 2 reference layout.
#
# This configuration declares logical topology only. It does not describe
# controller addresses, train movement, or operating behavior.
schema-version = 2

[blocks.west-entry]
display-name = "West entry"
endpoints = ["west", "east"]

[blocks.platform-1]
display-name = "Platform 1"
endpoints = ["west", "east"]

[blocks.platform-2]
display-name = "Platform 2"
endpoints = ["west", "east"]

[blocks.east-exit]
display-name = "East exit"
endpoints = ["west", "east"]

[turnouts.west-throat]
display-name = "West throat turnout"
positions = ["normal", "reverse"]

[turnouts.east-throat]
display-name = "East throat turnout"
positions = ["normal", "reverse"]

[traversals.west-to-platform-1]
from = "west-entry.east"
to = "platform-1.west"

[traversals.west-to-platform-1.turnouts]
west-throat = "normal"

[traversals.platform-2-to-east]
from = "platform-2.east"
to = "east-exit.west"

[traversals.platform-2-to-east.turnouts]
east-throat = "reverse"

[routes.west-to-platform-1]
display-name = "West entry to platform 1"
traversals = ["west-to-platform-1"]

[routes.platform-2-to-east]
display-name = "Platform 2 to east exit"
traversals = ["platform-2-to-east"]
