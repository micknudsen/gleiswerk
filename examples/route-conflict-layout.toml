# Route-conflict analysis example for schema-version 1.
#
# This declares resources used by two routes. It does not model topology,
# occupancy, reservations, commands, train movement, or operating behavior.
schema-version = 1

[blocks.west-entry]

[blocks.platform-1]

[blocks.east-exit]

[turnouts.west-throat]
positions = ["normal", "reverse"]

[routes.arrival-to-platform-1]
blocks = ["west-entry", "platform-1"]

[routes.arrival-to-platform-1.turnouts]
west-throat = "normal"

[routes.departure-from-platform-1]
blocks = ["platform-1", "east-exit"]

[routes.departure-from-platform-1.turnouts]
west-throat = "reverse"
