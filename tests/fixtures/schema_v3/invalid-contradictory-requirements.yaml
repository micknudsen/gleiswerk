schema-version: 3
junctions:
  throat:
    ports: [west, main]
    terminal-ports: [west, main]
control-devices:
  throat-turnout:
    positions: [normal, reverse]
junction-passages:
  to-main:
    junction: throat
    from: west
    to: main
    requirements:
      throat-turnout: normal
protection-rules:
  contradiction:
    trigger:
      kind: route-definition
      id: to-main
    requirements:
      throat-turnout: reverse
route-definitions:
  to-main:
    entry: junction:throat:west
    exit: junction:throat:main
    via: [junction-passage:to-main]
