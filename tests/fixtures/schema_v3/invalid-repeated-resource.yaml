schema-version: 3
track-sections:
  a:
    ports: [one, two]
    movements:
    - from: one
      to: two
  b:
    ports: [one, two]
    movements:
    - from: one
      to: two
connections:
  first-to-second:
    ports: [track-section:a:two, track-section:b:one]
    movements:
    - from: track-section:a:two
      to: track-section:b:one
  second-to-first:
    ports: [track-section:b:two, track-section:a:one]
    movements:
    - from: track-section:b:two
      to: track-section:a:one
route-definitions:
  loop:
    entry: track-section:a:one
    exit: track-section:a:two
    via: [connection:second-to-first]
