- id: compiled-plan-audit
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 11
  phase: compilation
  outcome: valid
  route: west-to-east-via-platform-1
  expected-audit: Every path Track Section and Junction is claimed and every rule
