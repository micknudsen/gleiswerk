manifest-version: 1
cases:
- id: direct-sections
  fixture: valid-direct.yaml
  adr-0010-scenarios:
  - 1
  phase: compilation
  outcome: valid
  route: direct-arrival
  expected-path:
  - kind: track-section
    id: approach
    from: west
    to: east
  - kind: connection
    id: approach-to-platform
    from: track-section:approach:east
    to: track-section:platform:west
  - kind: track-section
    id: platform
    from: west
    to: east
  expected-claims:
  - track-section:approach
  - track-section:platform
  expectation: The direct Connection proves continuity and contributes no Junction
    claim.
- id: within-one-section
  fixture: valid-direct.yaml
  adr-0010-scenarios:
  - 10
  phase: compilation
  outcome: valid
  route: within-platform
  expected-path:
  - kind: track-section
    id: platform
    from: west
    to: east
  expected-claims:
  - track-section:platform
  expectation: Explicit boundaries within one Track Section still claim that section.
- id: station-through-platform-1
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 2
  phase: compilation
  outcome: valid
  route: west-to-east-via-platform-1
  expected-path:
  - kind: track-section
    id: west-entry
    from: west
    to: east
  - kind: connection
    id: west-entry-to-throat
    from: track-section:west-entry:east
    to: junction:west-throat:west
  - kind: junction-passage
    id: west-to-platform-1
  - kind: connection
    id: west-throat-to-platform-1
    from: junction:west-throat:platform-1
    to: track-section:platform-1:west
  - kind: track-section
    id: platform-1
    from: west
    to: east
  - kind: connection
    id: platform-1-to-east-throat
    from: track-section:platform-1:east
    to: junction:east-throat:platform-1
  - kind: junction-passage
    id: platform-1-to-east
  - kind: connection
    id: east-throat-to-exit
    from: junction:east-throat:east
    to: track-section:east-exit:west
  - kind: track-section
    id: east-exit
    from: west
    to: east
  expected-claims:
  - junction:east-throat
  - junction:west-throat
  - track-section:east-exit
  - track-section:platform-1
  - track-section:west-entry
  expected-requirements:
  - east-throat-turnout=normal
  - west-throat-turnout=normal
  expectation: The path and claims include both throats and every intervening Track
    Section.
- id: station-reverse-platform-1
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 3
  phase: compilation
  outcome: valid
  route: east-to-west-via-platform-1
  expected-path:
  - kind: track-section
    id: east-exit
    from: east
    to: west
  - kind: connection
    id: east-throat-to-exit
    from: track-section:east-exit:west
    to: junction:east-throat:east
  - kind: junction-passage
    id: east-to-platform-1
  - kind: connection
    id: platform-1-to-east-throat
    from: junction:east-throat:platform-1
    to: track-section:platform-1:east
  - kind: track-section
    id: platform-1
    from: east
    to: west
  - kind: connection
    id: west-throat-to-platform-1
    from: track-section:platform-1:west
    to: junction:west-throat:platform-1
  - kind: junction-passage
    id: platform-1-to-west
  - kind: connection
    id: west-entry-to-throat
    from: junction:west-throat:west
    to: track-section:west-entry:east
  - kind: track-section
    id: west-entry
    from: east
    to: west
  expected-claims:
  - junction:east-throat
  - junction:west-throat
  - track-section:east-exit
  - track-section:platform-1
  - track-section:west-entry
  expected-requirements:
  - east-throat-turnout=normal
  - west-throat-turnout=normal
  expectation: Reverse-directed elements retain the same base physical claims.
- id: disjoint-routes
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 4
  phase: compatibility
  outcome: compatible
  routes:
  - west-to-east-via-platform-1
  - depot-only
  expected-result:
    route-pair:
    - depot-only
    - west-to-east-via-platform-1
    compatible: true
    conflicts: []
  expectation: The two plans have disjoint claims and no incompatible requirements.
- id: different-device-positions
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 5
  phase: compatibility
  outcome: conflict
  routes:
  - west-to-platform-1
  - west-to-platform-2
  expected-conflicts:
  - control-device:west-throat-turnout:normal:reverse
  expected-result:
    route-pair:
    - west-to-platform-1
    - west-to-platform-2
    compatible: false
    conflicts:
    - kind: incompatible-control-device-requirement
      control-device: west-throat-turnout
      required-positions:
        west-to-platform-1: normal
        west-to-platform-2: reverse
      provenance:
        west-to-platform-1:
        - junction-passage:west-to-platform-1
        west-to-platform-2:
        - junction-passage:west-to-platform-2
  expectation: Different positions of west-throat-turnout conflict even though route exits
    differ.
- id: same-device-position-shared-resources
  fixture: valid-station.yaml
  adr-0010-scenarios:
  - 6
  - 7
  phase: compatibility
  outcome: conflict
  routes:
  - west-to-east-via-platform-1
  - west-to-platform-1
  expected-conflicts:
  - junction:west-throat
  - track-section:platform-1
  - track-section:west-entry
  expected-result:
    route-pair:
    - west-to-east-via-platform-1
    - west-to-platform-1
    compatible: false
    conflicts:
    - kind: overlapping-exclusive-claim
      resource: junction:west-throat
      provenance:
        west-to-east-via-platform-1:
        - junction-passage:west-to-platform-1
        west-to-platform-1:
        - junction-passage:west-to-platform-1
    - kind: overlapping-exclusive-claim
      resource: track-section:platform-1
      provenance:
        west-to-east-via-platform-1:
        - track-section:platform-1
        west-to-platform-1:
        - track-section:platform-1
    - kind: overlapping-exclusive-claim
      resource: track-section:west-entry
      provenance:
        west-to-east-via-platform-1:
        - track-section:west-entry
        west-to-platform-1:
        - track-section:west-entry
  expectation: Equal device requirements do not remove common-throat and shared-track
    claims.
- id: crossing-and-protection
  fixture: valid-protection.yaml
  adr-0010-scenarios:
  - 7
  phase: compatibility
  outcome: conflict
  routes:
  - west-to-east
  - north-to-south
  expected-conflicts:
  - junction:diamond
  - protection-zone:crossing-fouling
  expected-result:
    route-pair:
    - north-to-south
    - west-to-east
    compatible: false
    conflicts:
    - kind: overlapping-exclusive-claim
      resource: junction:diamond
      provenance:
        north-to-south:
        - junction-passage:north-to-south
        west-to-east:
        - junction-passage:west-to-east
    - kind: overlapping-exclusive-claim
      resource: protection-zone:crossing-fouling
      provenance:
        north-to-south:
        - protection-rule:north-south-fouling
        west-to-east:
        - protection-rule:east-west-fouling
  expectation: Crossing and fouling conflicts are shared declared claims with rule
    provenance.
- id: non-path-protection
  fixture: valid-protection.yaml
  adr-0010-scenarios:
  - 7
  - 13
  phase: compilation
  outcome: valid
  route: west-to-east
  expected-non-path-claims:
  - protection-zone:crossing-fouling
  - protection-zone:east-overlap
  - protection-zone:siding-flank
  expected-requirements:
  - siding-trap=protecting
  expectation: Fouling, flank, and overlap rules contribute non-path claims and requirements.
- id: multi-section-detector
  fixture: valid-occupancy.yaml
  adr-0010-scenarios:
  - 8
  phase: validation
  outcome: valid
  expectation: main-detector completely covers two Track Sections without merging
    their identities.
- id: straddling-and-partial-evidence
  fixture: valid-occupancy.yaml
  adr-0010-scenarios:
  - 9
  phase: runtime-rule
  outcome: denied
  route: west-to-main
  expectation: Occupied, stale, unknown, faulted, or partial-only evidence keeps every
    overlapped route claim unavailable.
- id: startup-and-lost-feedback
  fixture: valid-occupancy.yaml
  adr-0010-scenarios:
  - 12
  phase: runtime-rule
  outcome: denied
  route: west-to-main
  expectation: At startup and after lost feedback, occupancy and turnout-position evidence is
    unknown and cannot support movement authority.
