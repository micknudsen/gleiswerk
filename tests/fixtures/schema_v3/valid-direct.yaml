schema-version: 3
track-sections:
  approach:
    ports: [west, east]
    terminal-ports: [west]
    movements:
    - from: west
      to: east
    - from: east
      to: west
  platform:
    ports: [west, east]
    terminal-ports: [east]
    movements:
    - from: west
      to: east
    - from: east
      to: west
connections:
  approach-to-platform:
    ports: [track-section:approach:east, track-section:platform:west]
    movements:
    - from: track-section:approach:east
      to: track-section:platform:west
    - from: track-section:platform:west
      to: track-section:approach:east
route-definitions:
  direct-arrival:
    entry: track-section:approach:west
    exit: track-section:platform:east
    via: [connection:approach-to-platform]
  within-platform:
    entry: track-section:platform:west
    exit: track-section:platform:east
