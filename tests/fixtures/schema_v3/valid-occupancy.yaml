schema-version: 3
track-sections:
  west:
    ports:
    - outer
    - throat
    terminal-ports:
    - outer
    movements:
    - from: outer
      to: throat
    - from: throat
      to: outer
  main:
    ports:
    - throat
    - outer
    terminal-ports:
    - outer
    movements:
    - from: throat
      to: outer
    - from: outer
      to: throat
  siding:
    ports:
    - throat
    - outer
    terminal-ports:
    - outer
    movements:
    - from: throat
      to: outer
    - from: outer
      to: throat
junctions:
  throat:
    ports:
    - west
    - main
    - siding
control-devices:
  throat-switch:
    positions:
    - normal
    - reverse
connections:
  west-to-throat:
    ports:
    - track-section:west:throat
    - junction:throat:west
    movements:
    - from: track-section:west:throat
      to: junction:throat:west
    - from: junction:throat:west
      to: track-section:west:throat
  throat-to-main:
    ports:
    - junction:throat:main
    - track-section:main:throat
    movements:
    - from: junction:throat:main
      to: track-section:main:throat
    - from: track-section:main:throat
      to: junction:throat:main
  throat-to-siding:
    ports:
    - junction:throat:siding
    - track-section:siding:throat
    movements:
    - from: junction:throat:siding
      to: track-section:siding:throat
    - from: track-section:siding:throat
      to: junction:throat:siding
junction-passages:
  west-to-main:
    junction: throat
    from: west
    to: main
    requirements:
      throat-switch: normal
  west-to-siding:
    junction: throat
    from: west
    to: siding
    requirements:
      throat-switch: reverse
occupancy-zones:
  main-detector:
    coverage:
    - resource: track-section:west
      extent: complete
    - resource: track-section:main
      extent: complete
  throat-detector:
    coverage:
    - resource: junction:throat
      extent: complete
    - resource: track-section:main
      extent: partial
    - resource: track-section:siding
      extent: partial
route-definitions:
  west-to-main:
    entry: track-section:west:outer
    exit: track-section:main:outer
    via:
    - junction-passage:west-to-main
